name: release-scripts

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/publish-dist.yml"
      - ".github/workflows/release-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Verify release scripts
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/package-editor-dist.test.sh
          bash .github/scripts/publish-editor-dist.test.sh
