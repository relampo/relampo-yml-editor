name: publish-dist

# Build the editor and publish a versioned dist tarball to the Relampo downloads
# bucket. relampo-backend's release pipelines fetch this artifact
# (scripts/fetch-editor-dist.sh) and embed it into the `relampo` CLI so
# `relampo studio` serves the editor offline.
#
# The artifact lands at:
#   s3://<bucket>/editor/<version>/dist.tar.gz
#   s3://<bucket>/editor/<version>/dist.tar.gz.sha256
# where <version> is the pushed tag (vX.Y.Z) or the workflow_dispatch input.
#
# Required repo configuration:
#   - vars.AWS_RELEASE_ROLE_ARN: an IAM role whose trust policy allows this repo
#     to assume it via GitHub OIDC, with s3:GetObject/s3:PutObject on editor/*.
#   - vars.STUDIO_CATALOG_KMS_KEY_ARN: an existing ECC_NIST_EDWARDS25519 KMS key
#     with SIGN_VERIFY usage. The release role needs kms:Sign and kms:Verify.
# The workflow does not create or manage the signing key.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        description: "Version to publish under (e.g. v0.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish under (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-editor-catalog
  cancel-in-progress: false

env:
  RELAMPO_DOWNLOADS_BUCKET: relampo-downloads-616250100969-20260201142308
  AWS_REGION: us-east-2

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Test release scripts
        run: |
          bash .github/scripts/package-editor-dist.test.sh
          bash .github/scripts/publish-editor-dist.test.sh
      - name: Build
        run: bun run build
      - name: Package dist
        id: pkg
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          if [ -z "$VER" ]; then
            echo "::error::could not resolve version to publish" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # vite builds to build/; tarball is rooted at index.html so the backend
          # can extract it straight into internal/studio/assets/dist.
          if [ ! -f build/index.html ]; then
            echo "::error::build/index.html missing — editor build did not produce expected output" >&2
            exit 1
          fi
          bash .github/scripts/package-editor-dist.sh build dist.tar.gz
          sha256sum dist.tar.gz | awk '{print $1}' > dist.tar.gz.sha256
          echo "Packaged $VER:"
          cat dist.tar.gz.sha256
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload to S3
        env:
          RELEASE_VERSION: ${{ steps.pkg.outputs.version }}
          ARCHIVE_PATH: dist.tar.gz
          ARCHIVE_SHA_PATH: dist.tar.gz.sha256
        run: |
          bash .github/scripts/publish-editor-dist.sh
      - name: Update signed editor catalog
        env:
          RELEASE_VERSION: ${{ steps.pkg.outputs.version }}
          KMS_KEY_ARN: ${{ vars.STUDIO_CATALOG_KMS_KEY_ARN }}
        run: |
          set -Eeuo pipefail
          : "${KMS_KEY_ARN:?vars.STUDIO_CATALOG_KMS_KEY_ARN is required}"

          catalog_key="editor/catalog.signed.json"
          head_error=""
          if head_error="$(aws s3api head-object --bucket "$RELAMPO_DOWNLOADS_BUCKET" --key "$catalog_key" --region "$AWS_REGION" 2>&1)"; then
            aws s3 cp "s3://$RELAMPO_DOWNLOADS_BUCKET/$catalog_key" catalog.previous.json --region "$AWS_REGION"
            jq -r '.payload' catalog.previous.json | base64 --decode > catalog.payload.json
            jq -r '.signature' catalog.previous.json | base64 --decode > catalog.signature.bin
            previous_key_id="$(jq -r '.keyId' catalog.previous.json)"
            previous_algorithm="$(jq -r '.algorithm' catalog.previous.json)"
            if [[ "$previous_key_id" != "$KMS_KEY_ARN" || "$previous_algorithm" != "ED25519_SHA_512" ]]; then
              printf 'Existing catalog uses an unexpected key or algorithm.\n' >&2
              exit 1
            fi
            aws kms verify \
              --key-id "$KMS_KEY_ARN" \
              --message-type RAW \
              --signing-algorithm ED25519_SHA_512 \
              --message fileb://catalog.payload.json \
              --signature fileb://catalog.signature.bin \
              --region "$AWS_REGION" >/dev/null
          else
            case "$head_error" in
              *404*|*NotFound*|*NoSuchKey*) printf '{"schemaVersion":1,"releases":[]}' > catalog.payload.json ;;
              *) printf '%s\n' "$head_error" >&2; exit 1 ;;
            esac
          fi

          archive_sha="$(tr -d '[:space:]' < dist.tar.gz.sha256)"
          archive_size="$(stat -c '%s' dist.tar.gz)"
          archive_url="https://dl.relampo.com/editor/$RELEASE_VERSION/dist.tar.gz"
          jq -cS \
            --arg version "$RELEASE_VERSION" \
            --arg url "$archive_url" \
            --arg sha256 "$archive_sha" \
            --argjson size "$archive_size" \
            '.schemaVersion = 1
             | .releases = (([.releases[] | select(.version != $version)] + [{
                 version: $version,
                 studioApiMin: 1,
                 studioApiMax: 1,
                 url: $url,
                 sha256: $sha256,
                 size: $size,
                 revoked: false
               }]) | if length > 12 then .[-12:] else . end)' \
            catalog.payload.json > catalog.next.json
          mv catalog.next.json catalog.payload.json

          payload_size="$(stat -c '%s' catalog.payload.json)"
          if (( payload_size > 4096 )); then
            printf 'Catalog payload is %s bytes; AWS KMS RAW signing permits at most 4096.\n' "$payload_size" >&2
            exit 1
          fi
          signature="$(aws kms sign \
            --key-id "$KMS_KEY_ARN" \
            --message-type RAW \
            --signing-algorithm ED25519_SHA_512 \
            --message fileb://catalog.payload.json \
            --region "$AWS_REGION" \
            --query Signature --output text)"
          payload="$(base64 --wrap=0 < catalog.payload.json)"
          jq -n -cS \
            --arg algorithm "ED25519_SHA_512" \
            --arg keyId "$KMS_KEY_ARN" \
            --arg payload "$payload" \
            --arg signature "$signature" \
            '{algorithm: $algorithm, keyId: $keyId, payload: $payload, signature: $signature}' \
            > catalog.signed.json

          aws s3 cp catalog.signed.json \
            "s3://$RELAMPO_DOWNLOADS_BUCKET/$catalog_key" \
            --region "$AWS_REGION" --sse AES256 \
            --content-type application/json \
            --cache-control "no-store"
