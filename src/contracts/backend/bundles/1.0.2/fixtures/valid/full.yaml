test:
  name: full-contract
  description: Supported editor structures
  version: '1.0'
variables:
  BASE_URL: http://127.0.0.1
data_source:
  type: txt
  path: users.txt
  mode: per_vu
  variable_names: user
http_defaults:
  base_url: http://127.0.0.1
  follow_redirects: true
metrics:
  percentiles: [50, 95, 99]
scenarios:
  - name: supported
    profile:
      label: contract
    load:
      type: constant
      users: 1
      iterations: 1
    cookies:
      clear_each_iteration: true
    cache_manager:
      clear_each_iteration: true
      max_elements: 100
    error_policy:
      on_4xx: continue
      on_5xx: stop
      on_timeout: continue
    steps:
      - get: /short
      - request:
          request_id: 7
          name: Full request
          method: POST
          url: /full
          enabled: true
          headers:
            Content-Type: application/json
          query_params:
            page: '1'
          body:
            user: '{{user}}'
          timeout: 1s
          follow_redirects: true
          recorded_at: 2026-08-18T00:00:00Z
          response:
            status: 200
            size_bytes: 2
            time_ms: 1
          response_preview:
            status: 200
          extractors:
            - name: id
              type: json_path
              var: id
              path: $.id
              default: none
          assertions:
            - name: response status
              type: status
              value: 200
          think_time: 1ms
      - group:
          name: Group
          enabled: true
          steps:
            - get: /group
      - transaction:
          name: Transaction
          enabled: true
          steps:
            - get: /transaction
      - parallel:
          name: Parallel
          enabled: true
          steps:
            - get: /parallel
      - balanced:
          name: Balanced
          type: total
          mode: virtual_users
          enabled: true
          steps:
            - percentage: 100
              get: /balanced
      - if: '{{run_branch}}'
        steps:
          - get: /if
      - loop: 1
        steps:
          - get: /loop
      - retry:
          attempts: 2
          backoff: 1ms
          steps:
            - get: /retry
      - one_time:
          name: Setup
          enabled: true
          steps:
            - get: /setup
      - think_time:
          duration: 1ms
          enabled: true
      - data_source:
          type: txt
          path: users.txt
          mode: per_vu
          variable_names: user
      - sql:
          name: Query
          dialect: postgres
          kind: query
          query: SELECT 1
          connection:
            host: 127.0.0.1
            port: 5432
            database: app
            user: app
            password: secret
          allow_writes: false
