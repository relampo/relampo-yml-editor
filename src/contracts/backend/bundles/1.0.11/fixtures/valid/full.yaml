component_configuration_version: 1
defaults:
  think_time: {duration: 1ms, enabled: false}
  http:
    headers: {X-Contract: root}
    auth: {type: none}
    timeout: 2s
    redirect_automatically: false
    retrieve_embedded_resources: false
    cookies: false
    cache: false
    error_policy: {on_error: continue}
    assertions: [{type: status, value: 200}]
  sql:
    error_policy: {on_error: continue, on_timeout: stop}
    assertions: [{type: duration, value: {min: 0, max: 1000}}]
test:
  scenario_mode: sequential
  name: full-contract
  description: Supported editor structures
  version: '1.0'
variables:
  BASE_URL: http://127.0.0.1
data_source:
  type: txt
  path: users.txt
  mode: per_vu
  variable_names: user
http_defaults:
  connection_scope: per_vu
  dns_cache_ttl: 30s
  base_url: http://127.0.0.1
  follow_redirects: true
grpc_defaults:
  target: runtime.test:443
  connection_scope: per_vu
  timeout: 1s
webrtc_defaults:
  timeout: 5s
  ice_gathering_timeout: 1s
  max_message_size: 1024
metrics:
  percentiles: [50, 95, 99]
scenarios:
  - name: supported
    defaults:
      think_time: 0ms
      http:
        headers: {X-Contract: scenario}
        timeout: 1s
        follow_redirects: false
        assertions: []
      sql:
        assertions: [{type: rows_returned, value: {min: 0, max: 10}}]
    data_source:
      type: csv
      file: scenario-users.csv
      mode: shared
      variable_names: user
    profile:
      load_type: constant
      concurrency: 1
    load:
      type: constant
      users: 1
      iterations: 1
    cookies:
      clear_each_iteration: true
    cache_manager:
      clear_each_iteration: true
      max_elements: 100
    error_policy:
      on_4xx: continue
      on_5xx: stop
      on_timeout: continue
    steps:
      - get: /short
      - post:
          url: /short-post
          enabled: false
          auth: {type: none}
          follow_redirects: false
          redirect_automatically: false
          retrieve_embedded_resources: false
          assertions: []
          think_time: {enabled: false}
          body_raw: payload
      - put: /short-put
      - delete: /short-delete
      - patch: /short-patch
      - head: /short-head
      - options: /short-options
      - request:
          request_id: 7
          name: Full request
          auth: {type: none}
          method: POST
          url: /full
          enabled: true
          headers:
            Content-Type: application/json
          query_params:
            page: '1'
          body:
            user: '{{user}}'
          files:
            - field: upload
              path: fixture.txt
              mime: text/plain
          timeout: 1s
          retry:
            attempts: 2
            backoff: 1ms
          follow_redirects: true
          redirect_automatically: false
          retrieve_embedded_resources: false
          cookie_override: inherit
          cache_override: inherit
          throughput:
            enabled: true
            target_rps: 1
          spark:
            - name: capture
              when: after
              script: return true
          error_policy:
            on_error: continue
          on_error: continue
          data_source:
            type: txt
            path: request-users.txt
            mode: shared
            variable_names: request_user
          chain_id: contract-chain
          chain_role: parent
          recorded_at: 2026-08-18T00:00:00Z
          response:
            status: 200
            size_bytes: 2
            time_ms: 1
          response_preview:
            status: 200
          extractors:
            - type: jsonpath
              var: id
              path: $.id
              default: none
            - type: regex
              var: regex_value
              pattern: 'id=(.*)'
            - type: header
              var: header_value
              header: X-Request-ID
            - type: body
              var: response_body
            - type: xpath
              var: xpath_value
              path: //id/text()
            - type: boundary
              var: boundary_value
              left_boundary: '<id>'
              right_boundary: '</id>'
          assertions:
            - name: response status
              type: status
              value: 200
            - type: contains
              value: ok
            - type: not_contains
              value: error
            - type: regex
              value: 'ok|success'
            - type: jsonpath
              path: $.id
              value: true
            - type: response_time_max
              max_ms: 1000
            - type: response_size
              size: 2
            - type: header
              name: Content-Type
              value: application/json
          think_time: 1ms
      - group:
          name: Group
          defaults:
            think_time: {duration: 1ms, enabled: true}
            http:
              headers: {X-Contract: container}
              auth: {type: none}
              follow_redirects: false
              assertions: []
            sql:
              assertions: []
            data_source:
              type: csv
              file: scoped-users.csv
              mode: shared
              strategy: sequential
              on_exhausted: recycle
              enabled: true
              bind: {user: scoped_user}
          enabled: true
          steps:
            - get: /group
      - controller:
          name: Controller
          defaults:
            think_time: {duration: 1ms, enabled: true}
            http:
              headers: {X-Contract: container}
              auth: {type: none}
              follow_redirects: false
              assertions: []
            sql:
              assertions: []
            data_source: {enabled: false}
          enabled: true
          steps:
            - get: /controller
      - assertions:
          - type: status
            value: 200
      - transaction:
          name: Transaction
          defaults:
            think_time: {duration: 1ms, enabled: true}
            http:
              headers: {X-Contract: container}
              auth: {type: none}
              follow_redirects: false
              assertions: []
            sql:
              assertions: []
          enabled: true
          steps:
            - get: /transaction
      - parallel:
          name: Parallel
          defaults:
            think_time: {duration: 1ms, enabled: true}
            http:
              headers: {X-Contract: container}
              auth: {type: none}
              follow_redirects: false
              assertions: []
            sql:
              assertions: []
          enabled: true
          steps:
            - get: /parallel
      - balanced:
          name: Balanced
          defaults:
            think_time: {duration: 1ms, enabled: true}
            http:
              headers: {X-Contract: container}
              auth: {type: none}
              follow_redirects: false
              assertions: []
            sql:
              assertions: []
          type: total
          mode: virtual_users
          enabled: true
          steps:
            - percentage: 100
              get: /balanced
      - if: '{{run_branch}}'
        steps:
          - get: /if
      - loop: 1
        steps:
          - get: /loop
      - retry:
          defaults:
            http: {timeout: 500ms, assertions: []}
            sql: {error_policy: {on_error: stop}}
          attempts: 2
          backoff: 1ms
          steps:
            - get: /retry
      - if:
          condition: '{{run_branch}}'
          defaults:
            http: {headers: {X-Contract: if}}
          steps:
            - get: /if-defaults
      - loop:
          count: 1
          defaults:
            think_time: {enabled: false}
            http: {cache: false, cookies: false}
          steps:
            - get: /loop-defaults
      - one_time:
          name: Setup
          defaults:
            think_time: {duration: 1ms, enabled: true}
            http:
              headers: {X-Contract: container}
              auth: {type: none}
              follow_redirects: false
              assertions: []
            sql:
              assertions: []
          enabled: true
          steps:
            - get: /setup
      - think_time:
          duration: 1ms
          enabled: true
      - data_source:
          type: txt
          path: users.txt
          mode: per_vu
          variable_names: user
      - sql:
          name: Query
          dialect: postgres
          kind: query
          query: SELECT 1
          connection:
            host: 127.0.0.1
            port: 5432
            database: app
            user: app
            password: secret
          allow_writes: false
          assertions:
            - type: rows_returned
              value: {min: 0, max: 1}
            - type: duration
              max_ms: 1000
          think_time: {enabled: false}
  - name: segments
    load:
      type: segments
      duration: 7s
      segments:
        - name: rps
          duration: 1s
          transition: constant
          target_rps: 5
          min_vus: 1
          max_vus: 2
        - name: vus
          duration: 1s
          transition: ramp_down
          target_vus: 1
        - name: vus-up
          duration: 1s
          transition: ramp_up
          target_vus: 3
        - name: own-rps
          duration: 1s
          transition: constant
          target_rps: 500
          min_vus: 10
          max_vus: 40
        - name: second-rps
          duration: 1s
          transition: constant
          target_rps: 200
          min_vus: 2
          max_vus: 30
        - name: equal-vus
          duration: 1s
          transition: constant
          target_vus: 30
        - name: zero-vus
          duration: 1s
          transition: ramp_down
          target_vus: 0
    steps:
      - get: /segments
